<!DOCTYPE html>
<html lang="pt-be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explo de Formulario</title>
</head>
<body>
    


    <form action="cadastro.php" method="get" autocomplete="on">
        <h1>Explo de formulario </h1>
           <p>
        <label for="iano">Em que ano Você Nasceu?</label>
        <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcIdade()">
           </p>
        <p>
            <label for="iidade">Sua idade e:</label>
            <output id="idade">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
    </form>
    <script>
      function calcIdade() {
        let atual = new Date().getFullYear()
        idade.innerHTML = Number(atual) - Number(iano.value)
      }
    </script>
    </p>
</body>
</html>
